<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online PDF Editor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
</head>
<body>
    <header>
        <h1>Online PDF Editor</h1>
    </header>
    <div id="toolbar">
        <button id="add-text-btn">Add Text</button>
        <input type="text" id="text-input" placeholder="Enter text here">
        <select id="font-select">
            <option value="Helvetica">Helvetica</option>
            <option value="TimesRoman">Times New Roman</option>
            <option value="Courier">Courier</option>
        </select>
        <input type="number" id="font-size-input" value="12">
        <input type="color" id="font-color-input" value="#000000">
        <button id="save-text-btn">Save Text</button>
        <button id="delete-text-btn">Delete</button>
        <button id="add-image-btn">Add Image</button>
        <input type="file" id="image-input" accept="image/jpeg, image/png" style="display: none;">
        <button id="save-images-btn">Save Images</button>
    </div>
    <main>
        <div id="pdf-viewer-container">
            <input type="file" id="file-input" accept="application/pdf">
            <button id="add-page-btn">Add Page</button>
            <button id="download-btn">Download</button>
            <div id="pdf-viewer"></div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
